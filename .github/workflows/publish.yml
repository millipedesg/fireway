name: Publish @millipedesg/fireway
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "publish" to run (dev AR + GH only; use a version tag for staging/prod)'
        required: true
  push:
    tags:
      - '*'

permissions:
  id-token: write
  packages: write
  contents: read

env:
  GOOGLE_ARTIFACT_REGISTRY_AUTH_VERSION: google-artifactregistry-auth@3.5.0

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Guard manual dispatch
        if: github.event_name == 'workflow_dispatch' && inputs.confirm != 'publish'
        run: |
          echo 'Manual runs require confirm=publish'
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Cloud SDK (Firestore emulator for tests)
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: beta,cloud-firestore-emulator

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Test
        run: yarn test

      - name: Pack release tarball
        run: npm pack

      - name: Resolve package version
        id: pkg
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TARBALL="$(ls -1t millipedesg-fireway-*.tgz | head -1)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tarball=${TARBALL}" >> "$GITHUB_OUTPUT"

      - name: Authenticate (dev AR)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/837633946356/locations/global/workloadIdentityPools/milli-pool/providers/github'
          service_account: 'gh-npm-publisher@millipede-dev.iam.gserviceaccount.com'

      - name: Publish tarball to dev AR
        run: |
          set -euo pipefail
          VERSION='${{ steps.pkg.outputs.version }}'
          TARBALL='${{ steps.pkg.outputs.tarball }}'
          chmod +x ./scripts/write-millipedesg-npmrc.sh
          ./scripts/write-millipedesg-npmrc.sh millipede-dev
          npx -y ${{ env.GOOGLE_ARTIFACT_REGISTRY_AUTH_VERSION }} \
            --repo-config=.npmrc --credential-config="$HOME/.npmrc"
          if npm view "@millipedesg/fireway@${VERSION}" version --userconfig="$HOME/.npmrc" &>/dev/null; then
            echo "Skip dev AR: ${VERSION} already published"
          else
            npm publish "$TARBALL" --userconfig="$HOME/.npmrc"
          fi

      - name: Authenticate (staging AR)
        if: startsWith(github.ref, 'refs/tags/')
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/362983291711/locations/global/workloadIdentityPools/milli-pool/providers/github-actions-provider'
          service_account: 'gh-npm-publisher@millipede-staging.iam.gserviceaccount.com'

      - name: Publish tarball to staging AR
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          VERSION='${{ steps.pkg.outputs.version }}'
          TARBALL='${{ steps.pkg.outputs.tarball }}'
          ./scripts/write-millipedesg-npmrc.sh millipede-staging
          npx -y ${{ env.GOOGLE_ARTIFACT_REGISTRY_AUTH_VERSION }} \
            --repo-config=.npmrc --credential-config="$HOME/.npmrc"
          if npm view "@millipedesg/fireway@${VERSION}" version --userconfig="$HOME/.npmrc" &>/dev/null; then
            echo "Skip staging AR: ${VERSION} already published"
          else
            npm publish "$TARBALL" --userconfig="$HOME/.npmrc"
          fi

      - name: Authenticate (prod AR)
        if: startsWith(github.ref, 'refs/tags/')
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/262802147889/locations/global/workloadIdentityPools/milli-pool/providers/github-actions-provider'
          service_account: 'gh-npm-publisher@millipede-prod.iam.gserviceaccount.com'

      - name: Publish tarball to prod AR
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          VERSION='${{ steps.pkg.outputs.version }}'
          TARBALL='${{ steps.pkg.outputs.tarball }}'
          ./scripts/write-millipedesg-npmrc.sh millipede-prod
          npx -y ${{ env.GOOGLE_ARTIFACT_REGISTRY_AUTH_VERSION }} \
            --repo-config=.npmrc --credential-config="$HOME/.npmrc"
          if npm view "@millipedesg/fireway@${VERSION}" version --userconfig="$HOME/.npmrc" &>/dev/null; then
            echo "Skip prod AR: ${VERSION} already published"
          else
            npm publish "$TARBALL" --userconfig="$HOME/.npmrc"
          fi

      - name: Dual-publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -euo pipefail
          VERSION='${{ steps.pkg.outputs.version }}'
          TARBALL='${{ steps.pkg.outputs.tarball }}'
          rm -f .npmrc
          {
            echo "@millipedesg:registry=https://npm.pkg.github.com"
            echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}"
          } > .npmrc.gh
          if npm view "@millipedesg/fireway@${VERSION}" version --userconfig=.npmrc.gh &>/dev/null; then
            echo "Skip GitHub Packages: ${VERSION} already published"
          else
            npm publish "$TARBALL" \
              --userconfig .npmrc.gh \
              --@millipedesg:registry=https://npm.pkg.github.com
          fi
          rm -f .npmrc.gh "$TARBALL"
